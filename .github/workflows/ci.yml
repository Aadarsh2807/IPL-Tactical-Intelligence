# Continuous checks for every push.
#
# The dataset is not committed, so this workflow fetches it from the project's
# own GitHub Release and verifies it against the recorded MD5s before running
# anything. That means the full suite runs here exactly as it does on a
# developer's machine, rather than a reduced subset that would pass even when
# the data-backed code is broken.
#
# If the release assets are ever renamed or removed, fetch_data.py fails loudly
# and names the missing files rather than silently skipping the data-backed
# tests.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  frontend:
    name: Frontend lint and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        working-directory: frontend
        run: npm ci

      - name: Lint
        working-directory: frontend
        run: npm run lint

      - name: Build
        working-directory: frontend
        run: npm run build

  backend:
    name: Backend suite (fetches the dataset)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install
        working-directory: backend
        run: python -m pip install -r requirements.txt

      - name: Fetch the dataset
        run: python scripts/fetch_data.py

      - name: Prove the environment and data are sound
        run: python scripts/preflight.py

      - name: Run the full test suite
        working-directory: backend
        run: python -m pytest -v

      - name: Upload the built warehouse as provenance
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: warehouse-provenance
          path: data/warehouse.duckdb
          if-no-files-found: ignore
          retention-days: 7
