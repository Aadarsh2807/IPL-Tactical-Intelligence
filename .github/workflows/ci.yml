# Continuous checks for every push.
#
# What runs here does not need the dataset. The full backend suite does,
# because the two source CSVs are not redistributable and are therefore
# not committed. Until their origin is recorded in docs/DATA.md, the
# data-backed tests cannot run on a fresh runner and are not wired in
# below. When that source is documented, add a job that fetches the
# files and runs `pytest` over backend/tests in full.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  frontend:
    name: Frontend lint and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        working-directory: frontend
        run: npm ci

      - name: Lint
        working-directory: frontend
        run: npm run lint

      - name: Build
        working-directory: frontend
        run: npm run build

  guards:
    name: Backend guards (no dataset needed)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install
        working-directory: backend
        run: python -m pip install -r requirements.txt

      - name: Interface copy guards
        working-directory: backend
        run: python -m pytest tests/test_no_jargon_in_ui.py -v